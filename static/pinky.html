<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pinky Integration</title>
  <link rel="stylesheet" href="/static/site.css" />
  <script src="/utils.js" defer></script>
  <script src="/static/pinky.js" defer></script>
</head>
<body>
<div class="container">
  <h1>Pinky Integration</h1>
  <div id="pinky-status-message" class="status-message"></div>
  <div class="pinky-actions"><button id="refresh-status" class="secondary-button">Refresh status</button></div>
  <div class="pinky-actions" role="tablist">
    <button class="secondary-button pinky-tab" data-tab="chat">Chat</button>
    <button class="secondary-button pinky-tab" data-tab="mcp">MCP Chat</button>
    <button class="secondary-button pinky-tab" data-tab="status">Tools/Status</button>
  </div>
  <section id="tab-chat" class="rci-card">
    <div class="pinky-layout">
      <aside><button id="chat-new" class="secondary-button">New</button><div id="chat-conversations"></div></aside>
      <main><div id="chat-messages"></div><textarea id="chat-input"></textarea><button id="chat-send">Send</button><div id="chat-confirm"></div></main>
    </div>
  </section>
  <section id="tab-mcp" class="rci-card" style="display:none">
    <div class="pinky-layout"><aside><button id="mcp-new" class="secondary-button">New</button><div id="mcp-conversations"></div></aside><main><div id="mcp-messages"></div><textarea id="mcp-input"></textarea><button id="mcp-send">Send</button></main></div>
  </section>
  <section id="tab-status" class="rci-card" style="display:none">
    <pre id="pinky-health"></pre><pre id="pinky-live-status"></pre><div id="pinky-tools-list"></div>
  </section>
</div>
</body>
</html>
